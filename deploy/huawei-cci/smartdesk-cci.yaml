apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartdesk-api
  labels:
    app: smartdesk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartdesk-api
  template:
    metadata:
      labels:
        app: smartdesk-api
    spec:
      containers:
        - name: smartdesk-api
          image: swr.${HUAWEI_REGION}.myhuaweicloud.com/${SWR_ORG}/smartdesk-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7860
          env:
            - name: AI_PROVIDER
              value: dashscope_openai
            - name: AI_MODEL
              value: qwen-plus
            - name: AI_BASE_URL
              value: https://dashscope.aliyuncs.com/compatible-mode/v1
            - name: ASR_PROVIDER
              value: dashscope_paraformer
            - name: ASR_WS_URL
              value: wss://dashscope.aliyuncs.com/api-ws/v1/inference
            - name: ASR_MODEL
              value: paraformer-realtime-v2
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smartdesk-secrets
                  key: dashscope-api-key
            - name: CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smartdesk-secrets
                  key: control-token
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 7860
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 7860
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: smartdesk-api
  labels:
    app: smartdesk-api
spec:
  type: LoadBalancer
  selector:
    app: smartdesk-api
  ports:
    - name: http
      port: 80
      targetPort: 7860
