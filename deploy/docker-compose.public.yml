services:
  smartdesk:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - .env.server
    restart: unless-stopped
    expose:
      - "7860"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - smartdesk
    env_file:
      - .env.server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
